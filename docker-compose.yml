services:
  ppocr:
    image: ${PPOCR_IMAGE:-ghcr.io/lxw112190/lw.ppocr.opencvdnn:1.0.0}
    ports:
      - "${PPOCR_PORT:-8787}:8787"
    environment:
      LW_PPOCR_LISTEN_HOST: "0.0.0.0"
      LW_PPOCR_PORT: "8787"
      LW_PPOCR_API_KEY: "${PPOCR_API_KEY:-}"
      LW_PPOCR_ENGINE_INSTANCES: "${PPOCR_ENGINE_INSTANCES:-1}"
      LW_PPOCR_WORKER_THREADS: "${PPOCR_WORKER_THREADS:-4}"
      LW_PPOCR_MAX_QUEUED_REQUESTS: "${PPOCR_MAX_QUEUED_REQUESTS:-32}"
      LW_PPOCR_ENGINE_WAIT_TIMEOUT_MS: "${PPOCR_ENGINE_WAIT_TIMEOUT_MS:-5000}"
      LW_PPOCR_MAX_BATCH_IMAGES: "${PPOCR_MAX_BATCH_IMAGES:-32}"
      LW_PPOCR_MAX_BATCH_TOTAL_PIXELS: "${PPOCR_MAX_BATCH_TOTAL_PIXELS:-40000000}"
      LW_PPOCR_MAX_BATCH_DECODED_BYTES: "${PPOCR_MAX_BATCH_DECODED_BYTES:-120000000}"
      LW_PPOCR_PDF_DPI: "${PPOCR_PDF_DPI:-200}"
      LW_PPOCR_MAX_PDF_PAGES: "${PPOCR_MAX_PDF_PAGES:-10}"
      LW_PPOCR_MAX_PDF_PAGE_PIXELS: "${PPOCR_MAX_PDF_PAGE_PIXELS:-25000000}"
      LW_PPOCR_MAX_PDF_TOTAL_PIXELS: "${PPOCR_MAX_PDF_TOTAL_PIXELS:-100000000}"
      LW_PPOCR_PDFIUM_LIBRARY: "${PPOCR_PDFIUM_LIBRARY:-}"
      LW_PPOCR_CORS_ENABLED: "${PPOCR_CORS_ENABLED:-false}"
      LW_PPOCR_CORS_ALLOWED_ORIGINS: "${PPOCR_CORS_ALLOWED_ORIGINS:-}"
      LW_PPOCR_LOG_FILE: "/data/logs/runtime.log"
      LW_PPOCR_ACCESS_LOG_FILE: "/data/logs/access.log"
      LW_PPOCR_LOGGING_ENABLED: "${PPOCR_LOGGING_ENABLED:-true}"
      LW_PPOCR_FILE_LOGGING_ENABLED: "${PPOCR_FILE_LOGGING_ENABLED:-true}"
      LW_PPOCR_REQUEST_LOGGING_ENABLED: "${PPOCR_REQUEST_LOGGING_ENABLED:-true}"
      LW_PPOCR_REQUEST_START_LOGGING_ENABLED: "${PPOCR_REQUEST_START_LOGGING_ENABLED:-true}"
      LW_PPOCR_ACCESS_FILE_LOGGING_ENABLED: "${PPOCR_ACCESS_FILE_LOGGING_ENABLED:-true}"
      LW_PPOCR_ACCESS_LOG_FORMAT: "${PPOCR_ACCESS_LOG_FORMAT:-jsonl}"
      LW_PPOCR_LOG_FLUSH_INTERVAL_SECONDS: "${PPOCR_LOG_FLUSH_INTERVAL_SECONDS:-1}"
      LW_PPOCR_TRUSTED_PROXIES: "${PPOCR_TRUSTED_PROXIES:-}"
    volumes:
      - ppocr-logs:/data/logs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ppocr-logs:
