name: macOS ARM64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCV_VERSION: 5.0.0
  OPENCV_SOURCE_SHA256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095
  PACKAGE_VERSION: 0.7.0
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install cmake ninja

      - name: Restore minimal OpenCV cache
        id: opencv-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci/opencv-5.0.0
          key: opencv-5.0.0-macos-15-arm64-minimal-v2-b0528f5a

      - name: Build minimal OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci "$RUNNER_TEMP/opencv-source" "$RUNNER_TEMP/opencv-build"
          curl --fail --location --retry 5 --retry-delay 5 \
            --retry-connrefused \
            "https://github.com/opencv/opencv/archive/${OPENCV_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/opencv.tar.gz"
          echo "${OPENCV_SOURCE_SHA256}  $RUNNER_TEMP/opencv.tar.gz" | \
            shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/opencv.tar.gz" --strip-components=1 \
            -C "$RUNNER_TEMP/opencv-source"
          cmake -S "$RUNNER_TEMP/opencv-source" -B "$RUNNER_TEMP/opencv-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/opencv-5.0.0" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_INSTALL_NAME_DIR=@rpath \
            -DCMAKE_INSTALL_RPATH=@loader_path \
            -DBUILD_LIST=core,imgproc,imgcodecs,dnn \
            -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_JAVA=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_TESTS=OFF \
            -DBUILD_JPEG=ON -DBUILD_PNG=ON -DBUILD_PROTOBUF=ON \
            -DBUILD_TIFF=ON -DBUILD_ZLIB=ON \
            -DWITH_EIGEN=OFF -DWITH_FFMPEG=OFF -DWITH_GDAL=OFF \
            -DWITH_GSTREAMER=OFF -DWITH_GTK=OFF -DWITH_IPP=OFF \
            -DWITH_ITT=OFF -DWITH_JASPER=OFF -DWITH_LAPACK=OFF \
            -DWITH_OPENCL=OFF -DWITH_OPENEXR=OFF -DWITH_QT=OFF \
            -DWITH_TBB=OFF -DWITH_WEBP=OFF
          cmake --build "$RUNNER_TEMP/opencv-build" --parallel 3
          cmake --install "$RUNNER_TEMP/opencv-build"

      - name: Save minimal OpenCV cache
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci/opencv-5.0.0
          key: ${{ steps.opencv-cache.outputs.cache-primary-key }}

      - name: Configure and build
        run: |
          bash -n scripts/package_macos.sh
          python3 -m py_compile scripts/http_smoke.py scripts/http_stress.py \
            scripts/http_invalid_inputs.py scripts/http_contract_test.py \
            scripts/config_contract_test.py \
            scripts/ocr_regression.py scripts/logging_smoke.py scripts/json_schema.py \
            scripts/check_abi.py scripts/validate_contracts.py \
            scripts/dependency_tools.py scripts/validate_dependencies.py \
            scripts/validate_model_manifest.py
          python3 scripts/validate_model_manifest.py \
            --manifest models/ppocrv6-tiny/model.json --require-sha256
          python3 scripts/validate_contracts.py
          python3 scripts/validate_dependencies.py
          config="$(find "$GITHUB_WORKSPACE/.ci/opencv-5.0.0" \
            -name OpenCVConfig.cmake -print -quit)"
          test -n "$config"
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOpenCV_DIR="$(dirname "$config")"
          cmake --build build/ci --parallel 3

      - name: Unit and real OCR tests
        run: |
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/.ci/opencv-5.0.0/lib"
          ctest --test-dir build/ci --output-on-failure
          build/ci/lw-ppocr-c-example \
            models/ppocrv6-tiny/model.json models/ppocrv6-tiny/sample.jpg

      - name: Package, smoke, and stability tests
        run: |
          bash scripts/package_macos.sh build/ci .ci/opencv-5.0.0 dist \
            "$PACKAGE_VERSION"
          package="dist/lw.PPOCR.OpenCVDNN-v${PACKAGE_VERSION}-macos-arm64"
          test -f "$package/dependencies.lock.json"
          test -f "$package/sbom/lw.PPOCR.OpenCVDNN.cdx.json"
          test -f "$package/schemas/http-api-v1.openapi.json"
          file "$package/lw-ppocr-http-service" | grep -q arm64
          python3 scripts/validate_model_manifest.py \
            --manifest "$package/models/ppocrv6-tiny/model.json" --require-sha256
          python3 scripts/config_contract_test.py --package-dir "$package"
          python3 scripts/http_smoke.py --package-dir "$package" --port 18787
          python3 scripts/logging_smoke.py --package-dir "$package" --port 18785 \
            --access-format jsonl
          python3 scripts/logging_smoke.py --package-dir "$package" --port 18783 \
            --access-format text
          python3 scripts/ocr_regression.py --package-dir "$package" \
            --cases tests/regression/ppocrv6-tiny.json --port 18786
          python3 scripts/http_invalid_inputs.py --package-dir "$package" \
            --port 18784
          python3 scripts/http_contract_test.py --package-dir "$package" \
            --port 18782
          python3 scripts/check_abi.py \
            --library "$package/liblw.PPOCR.OpenCVDNN.dylib"
          python3 scripts/http_stress.py --package-dir "$package" \
            --iterations 64 --concurrency 2 --port 18788
          otool -L "$package/lw-ppocr-http-service"

      - uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-macos-arm64
          path: |
            dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-macos-arm64.tar.gz
            dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
