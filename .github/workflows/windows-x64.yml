name: Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      stress_iterations:
        description: "HTTP stability iterations (64 by default)"
        required: false
        default: "64"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_VERSION: 0.7.0
  OPENCV_WINDOWS_SHA256: 9c6c1fcea58acdf06edba13148b2246e00c2658143fa51e61ecd370db8c39f63

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Validate repository scripts
        shell: pwsh
        run: |
          @("scripts/package_windows.ps1", "scripts/http_smoke.py", `
            "scripts/http_stress.py", "scripts/ocr_regression.py", `
            "scripts/http_invalid_inputs.py", "scripts/http_contract_test.py", `
            "scripts/config_contract_test.py", `
            "scripts/logging_smoke.py", "scripts/json_schema.py", `
            "scripts/check_abi.py", "scripts/validate_contracts.py", `
            "scripts/dependency_tools.py", "scripts/validate_dependencies.py", `
            "scripts/validate_model_manifest.py") | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Required repository script is missing: $_"
            }
          }
          python scripts/validate_model_manifest.py `
            --manifest models/ppocrv6-tiny/model.json --require-sha256
          python scripts/validate_contracts.py
          python scripts/validate_dependencies.py

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build C# P/Invoke example
        run: dotnet build examples/csharp -c Release

      - name: Restore OpenCV cache
        id: opencv-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-5.0.0-windows-x64-prebuilt-v2-9c6c1fce

      - name: Download and extract OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/opencvlibrary/5.0.0/opencv-5.0.0-windows.exe"
          $archive = Join-Path $env:RUNNER_TEMP "opencv.exe"
          curl.exe -L --fail --show-error --retry 5 --retry-delay 10 `
            --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "OpenCV download failed" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:OPENCV_WINDOWS_SHA256) {
            throw "OpenCV archive SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Path "${{ runner.temp }}/opencv" -Force | Out-Null
          7z x $archive "-o${{ runner.temp }}/opencv" -y
          if ($LASTEXITCODE -ne 0) { throw "OpenCV extraction failed" }

      - name: Save OpenCV cache
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/opencv
          key: ${{ steps.opencv-cache.outputs.cache-primary-key }}

      - name: Locate OpenCV
        shell: pwsh
        run: |
          $config = Get-ChildItem "${{ runner.temp }}/opencv" `
            -Filter OpenCVConfig.cmake -File -Recurse | Select-Object -First 1
          if (-not $config) { throw "OpenCVConfig.cmake not found" }
          $bin = Get-ChildItem "${{ runner.temp }}/opencv" `
            -Filter opencv_world500.dll -File -Recurse | Select-Object -First 1
          if (-not $bin) { throw "opencv_world500.dll not found" }
          "OpenCV_DIR=$($config.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
          "OpenCV_BIN=$($bin.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Build, test, and install
        shell: pwsh
        run: |
          cmake -S . -B build/ci -A x64 -DOpenCV_DIR="$env:OpenCV_DIR"
          cmake --build build/ci --config Release --parallel 2
          $env:PATH = "$env:OpenCV_BIN;${{ github.workspace }}/build/ci/Release;$env:PATH"
          ctest --test-dir build/ci -C Release --output-on-failure
          build/ci/Release/lw-ppocr-c-example.exe `
            models/ppocrv6-tiny/model.json models/ppocrv6-tiny/sample.jpg
          $help = build/ci/Release/lw-ppocr-http-service.exe --help
          if ($help -notmatch "--service") { throw "Windows service mode is missing" }
          cmake --install build/ci --config Release `
            --prefix "dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-windows-x64"

      - name: HTTP smoke and package
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $package = "dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-windows-x64"
          @("dependencies.lock.json", "sbom/lw.PPOCR.OpenCVDNN.cdx.json", `
            "schemas/http-api-v1.openapi.json") | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $package $_) -PathType Leaf)) {
              throw "Missing release metadata: $_"
            }
          }
          @("install-service.bat", "uninstall-service.bat", "start-service.bat", `
            "stop-service.bat", "restart-service.bat") | ForEach-Object {
              if (-not (Test-Path (Join-Path $package $_))) {
                throw "Missing Windows service script: $_"
              }
            }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            scripts/package_windows.ps1 -PackageDir $package
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
          python scripts/validate_model_manifest.py `
            --manifest "$package/models/ppocrv6-tiny/model.json" --require-sha256
          python scripts/config_contract_test.py --package-dir $package
          python scripts/http_smoke.py --package-dir $package --port 18787
          python scripts/logging_smoke.py --package-dir $package --port 18785 `
            --access-format jsonl
          python scripts/logging_smoke.py --package-dir $package --port 18783 `
            --access-format text
          python scripts/ocr_regression.py --package-dir $package `
            --cases tests/regression/ppocrv6-tiny.json --port 18786
          python scripts/http_invalid_inputs.py --package-dir $package `
            --port 18784
          python scripts/http_contract_test.py --package-dir $package `
            --port 18782
          python scripts/check_abi.py `
            --library "$package/lw.PPOCR.OpenCVDNN.dll"
          $iterations = 64
          if ("${{ github.event_name }}" -eq "schedule") {
            $iterations = 5000
          } elseif ("${{ inputs.stress_iterations }}" -match "^[1-9][0-9]*$") {
            $iterations = [int]"${{ inputs.stress_iterations }}"
          }
          Write-Output "HTTP stability iterations: $iterations"
          python scripts/http_stress.py --package-dir $package `
            --iterations $iterations --concurrency 4 --port 18788

      - uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-windows-x64
          path: |
            dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-windows-x64.zip
            dist/lw.PPOCR.OpenCVDNN-v${{ env.PACKAGE_VERSION }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
