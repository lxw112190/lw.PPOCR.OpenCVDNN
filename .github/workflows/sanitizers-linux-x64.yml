name: Linux x64 Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENCV_VERSION: 5.0.0
  OPENCV_SOURCE_SHA256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095

jobs:
  asan-ubsan:
    name: ASan + UBSan + invalid inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v6

      - name: Install compiler and OpenCV build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl libjpeg-dev libpng-dev \
            libtiff-dev pkg-config python3 python3-pip tar zlib1g-dev
          python3 -m pip install --user cmake==3.31.6 ninja==1.11.1.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore minimal OpenCV 5 cache
        id: opencv-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci/opencv-5.0.0
          key: opencv-5.0.0-ubuntu-22.04-x64-minimal-v1-b0528f5a

      - name: Build minimal OpenCV 5
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci /tmp/opencv-source /tmp/opencv-build
          curl --fail --location --retry 5 --retry-delay 5 \
            --retry-connrefused \
            "https://github.com/opencv/opencv/archive/${OPENCV_VERSION}.tar.gz" \
            --output /tmp/opencv.tar.gz
          echo "${OPENCV_SOURCE_SHA256}  /tmp/opencv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencv.tar.gz --strip-components=1 \
            -C /tmp/opencv-source
          cmake -S /tmp/opencv-source -B /tmp/opencv-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/opencv-5.0.0" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DBUILD_LIST=core,imgproc,imgcodecs,dnn \
            -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_JAVA=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_TESTS=OFF \
            -DBUILD_JPEG=ON -DBUILD_PNG=ON -DBUILD_PROTOBUF=ON \
            -DBUILD_TIFF=ON -DBUILD_ZLIB=ON \
            -DWITH_EIGEN=OFF -DWITH_FFMPEG=OFF \
            -DWITH_GDAL=OFF -DWITH_GSTREAMER=OFF -DWITH_GTK=OFF \
            -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_JASPER=OFF \
            -DWITH_LAPACK=OFF -DWITH_OPENCL=OFF -DWITH_OPENEXR=OFF \
            -DWITH_QT=OFF -DWITH_TBB=OFF -DWITH_WEBP=OFF
          cmake --build /tmp/opencv-build --parallel 2
          cmake --install /tmp/opencv-build

      - name: Save minimal OpenCV 5 cache
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci/opencv-5.0.0
          key: ${{ steps.opencv-cache.outputs.cache-primary-key }}

      - name: Configure sanitizer build
        run: |
          python3 -m py_compile scripts/http_smoke.py \
            scripts/http_stress.py scripts/http_benchmark.py \
            scripts/http_overload_test.py \
            scripts/http_invalid_inputs.py \
            scripts/http_contract_test.py scripts/config_contract_test.py \
            scripts/ocr_regression.py \
            scripts/json_schema.py scripts/validate_contracts.py \
            scripts/dependency_tools.py scripts/validate_dependencies.py \
            scripts/validate_release_version.py
          python3 scripts/validate_contracts.py
          python3 scripts/validate_dependencies.py
          python3 scripts/validate_release_version.py
          config="$(find "$GITHUB_WORKSPACE/.ci/opencv-5.0.0" \
            -name OpenCVConfig.cmake -print -quit)"
          test -n "$config"
          cmake -S . -B build/sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOpenCV_DIR="$(dirname "$config")" \
            -DLW_PPOCR_ENABLE_SANITIZERS=ON

      - name: Build and run native tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/opencv-5.0.0/lib
        run: |
          cmake --build build/sanitizers --parallel 2
          ctest --test-dir build/sanitizers --output-on-failure
          build/sanitizers/lw-ppocr-c-example \
            models/ppocrv6-tiny/model.json \
            models/ppocrv6-tiny/sample.jpg

      - name: Install sanitizer test package
        run: |
          cmake --install build/sanitizers \
            --prefix build/sanitizer-package

      - name: HTTP, malformed input, and recovery tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/opencv-5.0.0/lib
        run: |
          python3 scripts/config_contract_test.py \
            --package-dir build/sanitizer-package
          python3 scripts/http_smoke.py \
            --package-dir build/sanitizer-package --port 18827
          python3 scripts/http_invalid_inputs.py \
            --package-dir build/sanitizer-package --port 18824
          python3 scripts/http_stress.py \
            --package-dir build/sanitizer-package \
            --iterations 32 --concurrency 2 --port 18828 \
            --max-rss-growth-mb 256
          python3 scripts/http_overload_test.py \
            --package-dir build/sanitizer-package --port 18821
